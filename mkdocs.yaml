site_name: Enterprise AI Engineering Handbook

site_description: >
  A Production-Focused Handbook for Backend Engineers,
  Cloud Engineers, Software Architects, and AI Engineers.

site_author: Mihir Jha

site_url: https://mihirkjha.github.io/enterprise-ai-engineering-handbook/

repo_name: MihirJha/Enterprise-AI-Engineering-Handbook
repo_url: https://github.com/MihirKJha/Enterprise-AI-Engineering-Handbook

edit_uri: edit/main/docs/

copyright: Copyright © 2026 Mihir Jha

theme:
  name: material
  language: en
  features:
   - content.action.edit
  logo: assets/logos/favicon.png
  favicon: assets/logos/favicon.png

  palette:

    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:

    # Navigation
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer

    # Search
    - search.highlight
    - search.share
    - search.suggest

    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

    # Table of Contents
    - toc.follow

markdown_extensions:

  # Core Markdown
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - toc:
      permalink: true

  # PyMdown Extensions

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji

  - pymdownx.keys

  - pymdownx.mark

  - pymdownx.caret

  - pymdownx.tilde

plugins:
  - search

nav:
  - Home: index.md
  - Part I - Machine Learning: 01-machine-learning/index.md
  - Part II - Deep Learning: 02-deep-learning/index.md
  - Part III - Foundation Models, Large Language Models & Generative AI: 03-generative-ai/index.md
  - Part IV - Prompt Engineering & RAG Fundamentals: 04-retrieval-augmented-generation/index.md
  - Part V - Advanced Retrieval-Augmented Generation: 05-advanced-retrieval-augmented-generation/index.md
  - Part VI - AI Agents: 06-ai-agents/index.md
  - Part VII - Agentic AI & Multi-Agent Systems: 07-agentic-ai/index.md
  - Part VIII - AI Engineering Frameworks & Tooling: 08-ai-system-design/index.md
  - Part IX - MLOps, LLMOps & AIOps: 09-mlops/index.md
  - Part X - Cloud AI Engineering: 10-cloud-ai/index.md
  - Part XI - Enterprise AI Architecture & Design Patterns: 11-enterprise-ai-architecture/index.md
  - Part XII - Interview Preparation: 12-interview-preparation/index.md

plugins:
  - search

extra:

  social:

    - icon: fontawesome/brands/github
      link: https://github.com/MihirKJha

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mihirkrjha/

extra_css:
  - stylesheets/typography.css
  - stylesheets/layout.css
  - stylesheets/code.css
  - stylesheets/tables.css
  - stylesheets/admonitions.css
  - stylesheets/cards.css
  - stylesheets/homepage.css
  - stylesheets/custom.css
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js